version: "3.8"

services:
#  ___  ___ _ ____   _____ _ __
#  / __|/ _ \ '__\ \ / / _ \ '__|
#  \__ \  __/ |   \ V /  __/ |
#  |___/\___|_|    \_/ \___|_|

  server:
    image: kavyam02/nc-calc:v0.2.3
    environment:
      SOLANA_API_KEY: ${SOLANA_API_KEY}
      RATED_API_KEY: ${RATED_API_KEY}
      SUBSCAN_API_KEY: ${SUBSCAN_API_KEY}
    ports:
      - "8080:8080"
    networks: [nc]
    volumes:
      - nakaflow-data:/app/data
    restart: unless-stopped

#  __                 _                 _
#  / _|_ __ ___  _ __ | |_ ___ _ __   __| |
#  | |_| '__/ _ \| '_ \| __/ _ \ '_ \ / _` |
#  |  _| | | (_) | | | | ||  __/ | | | (_| |
#  |_| |_|  \___/|_| |_|\__\___|_| |_|\__,_|

  frontend:
    image: kavyam02/frontend_service:latest
    ports:
      - "3000:3000"
    environment:
      SERVER_URL: http://server:8080
    networks: [nc]
    restart: unless-stopped

networks:
  nc:

volumes:
  nakaflow-data: